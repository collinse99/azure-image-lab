name: Azure Login and RHEL Discovery

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm subscription
        run: |
          az account show \
            --query "{Name:name, State:state}" \
            --output table

      - name: List RHEL 8 image options
        run: |
          az vm image list-skus \
            --location eastus \
            --publisher RedHat \
            --offer RHEL \
            --query "[?starts_with(name, '8')].name" \
            --output table

      - name: List RHEL 8.10 image versions
        run: |
          az vm image list \
            --location eastus \
            --publisher RedHat \
            --offer RHEL \
            --sku 810-gen2 \
            --all \
            --query "sort_by(@, &version)[].{Version:version, URN:urn}" \
            --output table            
