name: Build RHEL Golden Image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rhel8-golden-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm resource groups
        run: |
          az group show --name rg-image-lab \
            --query "{ResourceGroup:name,Location:location}" -o table
          az group show --name rg-image-build \
            --query "{ResourceGroup:name,Location:location}" -o table

      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.14.0"

      - name: Install Packer plugins
        run: |
          packer plugins install github.com/hashicorp/azure
          packer plugins install github.com/hashicorp/ansible

      - name: Install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install "ansible-core==2.16.14"
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Validate template before building
        run: packer validate packer/rhel8.json

      - name: Build RHEL golden image
        run: packer build -on-error=cleanup packer/rhel8.json
