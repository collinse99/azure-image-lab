name: Packer Lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        
      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure access
        run: |
          az account show --query "{Subscription:name,State:state}" -o table
          az group show --name rg-image-lab \
            --query "{ResourceGroup:name,Location:location}" -o table
            
      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.14.0"

      - name: Show Packer version
        run: packer version

      - name: Install Azure plugin
        run: packer plugins install github.com/hashicorp/azure
        
      - name: Install Ansible plugin
        run: packer plugins install github.com/hashicorp/ansible

      - name: Install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install "ansible-core==2.16.14"
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Check Ansible playbook syntax
        run: ansible-playbook --syntax-check -i localhost, ansible/baseline.yml

      - name: Show GitHub IDs
        run: |
          echo "Organization ID: ${{ github.repository_owner_id }}"
          echo "Repository ID: ${{ github.repository_id }}"        
        
      - name: Check JSON formatting
        run: python3 -m json.tool packer/rhel8.json

      - name: Check Packer template syntax
        run: packer validate -syntax-only packer/rhel8.json
